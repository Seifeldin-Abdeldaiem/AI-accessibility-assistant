# Render Blueprint: the whole app as ONE free web service.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# No URLs to copy between services and no CORS to set: the image built from
# the root Dockerfile serves the website and the scanning API on one origin.
#
# The image is exercised on every push by .github/workflows/docker.yml,
# which builds it, runs it capped at 512 MB (the free plan's memory) and
# scans a real public page.
services:
  - type: web
    name: unkerb
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free: $0, sleeps after ~15 minutes idle, so the first visit after a
    # quiet spell takes about a minute to wake. Move to "starter" or above
    # for always-on and more memory headroom.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # One headless browser at a time keeps a scan inside 512 MB.
      - key: MAX_CONCURRENT_SCANS
        value: "1"
      # Off: Atlas's website is now the always-awake service on this Render
      # workspace and wakes the others (including Unkerb) when visited. To
      # make Unkerb the hub again, list the URLs to wake here (comma-
      # separated) and restore the keep-awake workflow. See
      # backend/app/wake.py and DEPLOYMENT.md.
      - key: WAKE_URLS
        value: ""
      # Never add ALLOW_PRIVATE_NETWORKS here: it turns off the protection
      # against scanning internal addresses. The app defaults it to false.
      - key: ANTHROPIC_API_KEY
        sync: false # optional: leave blank — visitors can bring their own key
